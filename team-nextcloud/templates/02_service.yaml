apiVersion: v1
kind: Service
metadata:
  name: {{ include "team-nextcloud.fullname" . }}-nc
  namespace: default
spec:
  ports:
    - protocol: TCP
      name: web
      port: 80
  selector:
    app: {{ include "team-nextcloud.fullname" . }}-nc
---
# Client-Push Service (intern: Traefik → push-Container)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "team-nextcloud.fullname" . }}-push
  namespace: default
spec:
  ports:
    - protocol: TCP
      name: push
      port: 7867
      targetPort: 7867
  selector:
    app: {{ include "team-nextcloud.fullname" . }}-nc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "team-nextcloud.fullname" . }}-db
  namespace: default
spec:
  ports:
    - protocol: TCP
      name: sql
      port: 3306
  selector:
    app: {{ include "team-nextcloud.fullname" . }}-db
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "team-nextcloud.fullname" . }}-redis
  namespace: default
spec:
  ports:
    - protocol: TCP
      name: redis
      port: 6379
  selector:
    app: {{ include "team-nextcloud.fullname" . }}-redis
---
# Collabora Online Document Server Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "team-nextcloud.fullname" . }}-collabora
  namespace: default
spec:
  ports:
    - name: coolwsd
      port: 9980
      targetPort: 9980
      protocol: TCP
  selector:
    app: {{ include "team-nextcloud.fullname" . }}-collabora
---
# AIO HPB Service - nur aktiv wenn hpb.enabled: true
{{- if .Values.hpb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "team-nextcloud.fullname" . }}-hpb
  namespace: default
spec:
  ports:
    - name: signaling
      port: 8081
      targetPort: 8081
      protocol: TCP
  selector:
    app: {{ include "team-nextcloud.fullname" . }}-hpb
{{- end }}
