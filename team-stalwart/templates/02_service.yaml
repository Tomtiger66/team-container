# Web-Admin Service (intern: Traefik → Pod)
# Mail-Ports brauchen keinen Service - laufen über hostPort
apiVersion: v1
kind: Service
metadata:
  name: {{ include "team-stalwart.fullname" . }}-admin
  namespace: default
spec:
  ports:
    - name: admin
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: {{ include "team-stalwart.fullname" . }}
