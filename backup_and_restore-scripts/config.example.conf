# Kopieren nach ~/.backup-teamserver.conf und anpassen.
# Diese Datei NICHT ins Git-Repo einchecken (enthaelt Zugangsdaten)!

# Lokales Backup-Verzeichnis (Default: $HOME/Backup)
#BACKUP_DIR="$HOME/Backup"

# FTP-Ziel fuer automatischen Upload nach jedem Backup.
# Zeilen auskommentiert lassen / FTP_HOST leer lassen, um den
# FTP-Upload zu deaktivieren (dann bleibt es beim rein lokalen Backup).
#FTP_HOST="ftp.example.org"
#FTP_USER="backup-user"
#FTP_PASS="changeme"
#FTP_DIR="/teamserver-backups"
