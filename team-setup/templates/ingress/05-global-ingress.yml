# global https redirect
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: global-redirect-http
spec:
  redirectScheme:
    scheme: https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute-allredirect
  namespace: default
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: landingpage
          port: 80
      middlewares:
        - name: global-redirect-http
