kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: default
  name: {{ include "team-video.fullname" . }}-jvb
  labels:
    app: {{ include "team-video.fullname" . }}-jvb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "team-video.fullname" . }}-jvb
  template:
    metadata:
      labels:
        app: {{ include "team-video.fullname" . }}-jvb
      annotations:
        timestamp: "{{ now | unixEpoch }}"
    spec:
      containers:
       - name: jvb
         image: jitsi/jvb:stable-10741
         imagePullPolicy: {{ .Values.app.pullpolicy }}
         ports:
         - containerPort: 30000
           protocol: UDP
         - containerPort: 30001
         resources: {}
         env:
          - name: XMPP_SERVER
            value: {{ include "team-video.fullname" . }}-prosody
          - name: DOCKER_HOST_ADDRESS
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
          - name: XMPP_DOMAIN
            value: meet.jitsi
          - name: XMPP_AUTH_DOMAIN
            value: auth.meet.jitsi
          - name: XMPP_INTERNAL_MUC_DOMAIN
            value: internal-muc.meet.jitsi
          {{ if .Values.auth.guests}}
          - name: XMPP_GUEST_DOMAIN
            value: guest.meet.jitsi
          {{end}}
          - name: JVB_PORT
            value: "30000"
          - name: JVB_TCP_PORT
            value: "30001"
          - name: JVB_AUTH_USER
            value: jvb
          - name: JVB_AUTH_PASSWORD
            value: {{ .Values.secrets.jvb.auth }}
          - name: JVB_BREWERY_MUC
            value: jvbbrewery
          - name: JVB_STUN_SERVERS
          {{ if .Values.stun.server}}
            value: {{ .Values.stun.server }}
          {{else}}
            value: stun.l.google.com:19302,stun1.l.google.com:19302,stun2.l.google.com:19302
          {{end}}
          - name: TZ
            value: Europe/Paris

          # === OPTIONALE VIDEOBRIDGE-OPTIONEN ===
          {{- if hasKey .Values "jvbTrustBwe" }}
          - name: VIDEOBRIDGE_DEBUG_OPTIONS
            value: "-Dvideobridge.cc.trust-bwe={{ .Values.jvbTrustBwe }}"
          {{- end }}
