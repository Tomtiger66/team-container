kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: default
  name: {{ include "team-video.fullname" . }}-web
  labels:
    app: {{ include "team-video.fullname" . }}-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "team-video.fullname" . }}-web
  template:
    metadata:
      labels:
        app: {{ include "team-video.fullname" . }}-web
      annotations:
        timestamp: "{{ now | unixEpoch }}"
    spec:
      containers:
       - name: web
         image: jitsi/web:stable-10741
         imagePullPolicy: {{ .Values.app.pullpolicy }}
         ports:
          - name: web
            containerPort: 80
        {{if .Values.hideWelcomePage}}
         lifecycle:
           postStart:
             exec:
               command: ['/bin/bash', '-c', 'sleep 60; sed -i "s/enableWelcomePage: true,/enableWelcomePage: false,/g" /config/config.js']
        {{end}}
         env:
          {{ if .Values.auth.enabled}}
          - name: ENABLE_AUTH
            value: "1"
            {{ if .Values.auth.guests}}
          - name: ENABLE_GUESTS
            value: "1"
            {{end}}
          {{end}}
          - name: JICOFO_AUTH_USER
            value: focus
          - name: XMPP_DOMAIN
            value: meet.jitsi
          - name: XMPP_AUTH_DOMAIN
            value: auth.meet.jitsi
          - name: XMPP_MUC_DOMAIN
            value: muc.meet.jitsi
          {{ if .Values.auth.guests}}
          - name: XMPP_GUEST_DOMAIN
            value: guest.meet.jitsi
          {{end}}
          - name: XMPP_BOSH_URL_BASE
            value: http://{{ include "team-video.fullname" . }}-prosody.default.svc.cluster.local:5280
          - name: BOSH_URL
            value: http://{{ include "team-video.fullname" . }}-prosody.default.svc.cluster.local:5280/http-bind
          - name: WEBSOCKET_URL
            value: ws://{{ include "team-video.fullname" . }}-prosody.default.svc.cluster.local:5280/xmpp-websocket
          - name: WEBSOCKET_COLIBRI_URL
            value: ws://{{ include "team-video.fullname" . }}-prosody.default.svc.cluster.local:9090/colibri-ws
          - name: PUBLIC_URL
            value: "https://{{ .Values.app.name }}.{{ .Values.app.domain }}"
          - name: SHOW_JITSI_WATERMARK
            value: "false"
          - name: SHOW_WATERMARK_FOR_GUESTS
            value: "false"
          - name: TZ
            value: Europe/Paris
